<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra Cards</title>
<style>
  :root { --k:1; --bg:#1d1b2a; --panel:#2a2740; --ink:#f1ecff; --muted:#a59fc4; --accent:#ffd166; --bad:#ef476f; --good:#06d6a0; --card:#f7f1e3; --cardInk:#2a2740; --eqSize:56px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family: "Courier New", ui-monospace, monospace; user-select:none; -webkit-user-select:none; overflow:hidden; touch-action:none; }
  #app { max-width:960px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:12px 16px; gap:8px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .hpwrap { display:flex; align-items:center; gap:10px; }
  .hpbar { width:200px; height:20px; background:#000a; border:2px solid var(--ink); position:relative; }
  .hpfill { height:100%; background:var(--bad); transition:width .3s; }
  .hptext { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; }
  .topbtn { font-size:14px; padding:4px 10px; }

  /* run map strip and skill meters */
  #map { display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  #map .node { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:2px solid #000; background:var(--panel); border-radius:6px; font-size:15px; }
  #map .node.done { opacity:.35; }
  #map .node.cur { background:var(--accent); color:#000; transform:scale(1.15); }
  #map .node.tutorial { border-color:var(--good); }
  #map .link { width:8px; height:2px; background:var(--muted); opacity:.5; }
  #skills { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; font-size:12px; }
  .skill { display:flex; align-items:center; gap:6px; position:relative; }
  .skill.locked { opacity:.4; }
  .meter { width:90px; height:10px; background:#000a; border:1px solid var(--muted); position:relative; }
  .meter .fill { height:100%; background:var(--good); transition: width .6s; }
  .meter .goal { position:absolute; left:80%; top:-3px; bottom:-3px; width:2px; background:var(--accent); }
  .skill .tag { font-size:11px; padding:0 4px; border-radius:3px; }
  .tag.review { background:var(--bad); color:#000; } .tag.mastered { background:var(--good); color:#000; }
  .delta { position:absolute; right:-6px; top:-14px; font-weight:bold; animation: floatup 1.8s forwards; pointer-events:none; }
  .delta.up { color:var(--good); } .delta.down { color:var(--bad); }
  @keyframes floatup { 0% { opacity:0; transform:translateY(6px); } 15% { opacity:1; } 100% { opacity:0; transform:translateY(-16px); } }

  #arena { flex:1; background:var(--panel); border:3px solid #000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; position:relative; min-height:250px; overflow:hidden; }
  #foe { font-size:14px; color:var(--muted); text-align:center; min-height:18px; }
  #foe b { color:var(--ink); }
  #foe .rank { padding:0 5px; border:1px solid var(--muted); border-radius:3px; margin-left:4px; font-size:12px; }
  #foe .pips { margin-left:8px; letter-spacing:2px; }
  #enemyBox { transition: transform calc(.3s * var(--k)), opacity calc(.5s * var(--k)); line-height:0; }
  #enemyBox svg { image-rendering:pixelated; }
  #enemyBox.dead { transform: scale(0) rotate(90deg); opacity:0; }
  #enemyBox.hit { animation: hit calc(.5s * var(--k)); }
  @keyframes hit { 0%,100% { transform:none; filter:none; } 30% { transform: translateX(-8px) scale(.92); filter: brightness(3); } 60% { transform: translateX(6px); } }
  #equation { display:flex; align-items:center; gap:4px; font-size:var(--eqSize); font-weight:bold; flex-wrap:wrap; justify-content:center; perspective:600px; position:relative; padding-bottom:.5em; }
  .tok { padding:14px 12px; border:4px dashed transparent; border-radius:10px; min-width:64px; white-space:pre; min-height:96px; display:flex; align-items:center; justify-content:center; text-align:center; max-width:320px; transition: background .15s, border-color .15s, max-width .25s, min-width .25s, padding .25s, opacity .25s, transform .25s, color .2s; }
  #arena.targeting .tok:not(.eq) { border-color: var(--muted); background:#ffffff0d; }
  #arena.anywhere { outline:4px dashed var(--muted); outline-offset:-10px; }
  #arena.anywhere.hover { outline-color: var(--accent); background:#2f2b4a; }
  .tok.hover { border-color: var(--accent); background:#ffd16633; }
  .tok.eq { color:var(--muted); min-width:0; padding:14px 8px; }
  .tok.var { color:var(--accent); }
  .frac { display:inline-flex; flex-direction:column; align-items:center; font-size:.62em; line-height:1.05; vertical-align:middle; margin:0 .08em; }
  .frac > span:last-child { border-top:.09em solid currentColor; padding-top:.05em; }
  /* operation animation states */
  .tok.op-new { color:#7bdff2; }
  .tok.enter { animation: enter .3s cubic-bezier(.2,1.6,.4,1); }
  @keyframes enter { from { transform: translateY(-60px) scale(.2); opacity:0; } }
  .tok.cancel { color:var(--bad); text-decoration: line-through; transform: scale(1.12); }
  .tok.gone { opacity:0; max-width:0; min-width:0; padding-left:0; padding-right:0; transform: scale(.3); overflow:hidden; border-width:0; }
  .tok.merge { color:var(--good); transform: scale(1.1); }
  .tok.pop { animation: pop .3s; color:var(--good); }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .tok.flip { animation: flip .24s ease-in-out; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  .tok.spin { animation: spin .45s ease-in-out; }
  @keyframes spin { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
  /* difficulty picker */
  .diff { display:flex; flex-direction:column; gap:6px; }
  .diff input[type=range] { width:100%; accent-color:var(--accent); height:32px; touch-action:pan-x; }
  .diffLabels { display:flex; justify-content:space-between; font-size:14px; font-weight:bold; }
  .diffLabels .lockd { color:var(--muted); font-weight:normal; }
  .diffTag { font-size:11px; padding:1px 6px; border:1px solid var(--muted); border-radius:3px; }
  /* operations written under a term */
  .unote { position:absolute; transform:translateX(-50%); margin-top:.1em; font-size:.42em; color:#7bdff2; white-space:nowrap; pointer-events:none; z-index:2;
           display:flex; align-items:center; line-height:1.1; text-shadow:0 2px 0 #000;
           transition: opacity .2s, color .2s; animation: noteIn .15s ease-out; }
  .unote.divnote { margin-top:0; flex-direction:column; }
  .unote .ubar { display:block; height:.14em; min-height:3px; background:currentColor; border-radius:2px; margin-bottom:.08em; animation: grow .15s ease-out; }
  @keyframes noteIn { from { transform: translate(-50%, 6px); opacity:0; } }
  .unote.cancel { color:var(--bad); text-decoration:line-through; }
  .unote.merge { color:var(--good); }
  .unote.out { opacity:0; }
  .unote.spin { animation: spinNote .45s ease-in-out; }
  @keyframes spinNote { from { transform: translateX(-50%) rotateY(0); } to { transform: translateX(-50%) rotateY(360deg); } }
  /* division written as a fraction */
  .tok.var .den { color:var(--ink); }
  .frac > span { transition: opacity .25s, color .2s; }
  .frac .cancel { color:var(--bad); text-decoration:line-through; }
  .frac .gone { opacity:0; }
  @keyframes grow { from { transform: scaleX(0); } }

  /* solve celebration and moving to the next question */
  #celebrate { position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  .stamp { position:absolute; left:0; right:0; text-align:center; font-size:clamp(28px, 7vw, 52px); font-weight:bold; color:var(--good);
           text-shadow: 0 3px 0 #000, 0 0 18px #06d6a088; letter-spacing:3px; animation: stamp calc(.6s * var(--k)) cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stamp { 0% { transform: scale(3) rotate(-14deg); opacity:0; } 100% { transform: scale(1) rotate(-5deg); opacity:1; } }
  .spark { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; box-shadow:0 0 8px currentColor; animation: spark calc(.95s * var(--k)) cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes spark { 0% { transform: translate(0,0) scale(1.2); opacity:1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(180deg); opacity:0; } }
  #equation.solved .tok { animation: cheer calc(.7s * var(--k)) ease-in-out 2; }
  @keyframes cheer { 50% { transform: translateY(-10px) scale(1.1); color:var(--accent); text-shadow: 0 0 16px #ffd166aa; } }
  .leave { animation: leave calc(.35s * var(--k)) ease-in forwards !important; }
  @keyframes leave { to { transform: translateX(-70px); opacity:0; } }
  .arrive { animation: arrive calc(.45s * var(--k)) cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes arrive { from { transform: translateX(70px); opacity:0; } }
  .card.deal { animation: deal calc(.4s * var(--k)) cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes deal { from { transform: translateY(70px) rotate(8deg); opacity:0; } }
  #step { font-size:20px; color:var(--muted); min-height:26px; text-align:center; padding:0 10px; }
  #msg { font-size:17px; min-height:22px; text-align:center; padding:0 10px; }
  #msg.bad { color:var(--bad); } #msg.good { color:var(--good); }
  #unlock { font-size:17px; color:var(--accent); min-height:0; text-align:center; font-weight:bold; }
  #hand { display:flex; justify-content:center; gap:12px; min-height:150px; flex-wrap:wrap; padding-bottom:6px; }
  .card { width:132px; height:150px; padding:8px; text-align:center; background:var(--card); color:var(--cardInk); border:3px solid #000; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:28px; font-weight:bold; cursor:grab; box-shadow: 0 4px 0 #000; touch-action:none; }
  .card { position:relative; }
  .card .badge { position:absolute; top:4px; right:4px; font-size:13px; font-weight:bold; padding:0 4px; line-height:1.3; border-radius:4px; border:2px solid #000; }
  .cicon { display:inline-flex; align-items:center; justify-content:center; width:1.5em; height:1.5em; font-size:24px; border-radius:6px; border:2px solid #000; margin-bottom:4px; flex:none; }
  .cicon.k-add, .cicon.k-sub { background:#c9f2df; color:#0b5a3c; }
  .cicon.k-mul, .cicon.k-div, .cicon.k-recip, .cicon.k-neg { background:#d9d2ff; color:#3a2a8c; }
  .cicon.k-comb, .cicon.k-dist, .cicon.k-lcd { background:#ffe0a8; color:#6b3d00; }
  .cicon.k-flip { background:#ffc9d6; color:#7a1530; }
  .cicon.k-none, .cicon.k-all { background:#e4e4e4; color:#333; }
  .keyBtn { font:inherit; font-weight:bold; font-size:inherit; padding:1px 8px; background:transparent; color:inherit; border:2px solid var(--muted); border-radius:4px; cursor:pointer; }
  .keyGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:6px 14px; }
  .keyRow { display:flex; align-items:center; gap:8px; font-size:14px; }
  .keyRow .cicon { font-size:18px; margin:0; }
  #whyBody .badge { font-size:14px; padding:0 6px; border-radius:4px; border:2px solid #000; }
  .key { display:flex; justify-content:center; align-items:center; gap:18px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .key .badge { font-size:15px; font-weight:bold; padding:0 8px; border-radius:4px; border:2px solid #000; margin-right:4px; }
  .badge.both { background:#cfe8ff; color:#1d3b5c; }
  .badge.part { background:#ffd166; color:#5c3b00; }
  .card small { font-size:13px; font-weight:bold; margin-top:8px; color:#4a4470; line-height:1.25; }
  .card:hover { transform: translateY(-6px); }
  .card.dragging { position:fixed; z-index:10; cursor:grabbing; transform: rotate(-4deg) scale(1.08); pointer-events:none; }
  .card.placeholder { visibility:hidden; }
  .speed { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); }
  .speed button { font-size:14px; padding:4px 10px; background:var(--panel); color:var(--ink); border:2px solid #000; }
  .speed button.on { background:var(--accent); color:#000; }
  #next { position:absolute; bottom:10px; left:0; right:0; text-align:center; color:var(--muted); font-size:14px; display:none; }
  #next.show { display:block; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.4; } }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  .flash { animation: flash .35s; }
  @keyframes flash { 0%{box-shadow: inset 0 0 0 999px #ef476f66} 100%{box-shadow: inset 0 0 0 999px transparent} }
  button { font-family:inherit; font-size:18px; padding:10px 18px; background:var(--accent); border:3px solid #000; cursor:pointer; font-weight:bold; color:#000; }
  button.ghost { background:var(--panel); color:var(--ink); }
  .help { color:var(--muted); font-size:13px; text-align:center; }

  /* overlays: title, tutorial intro, run end, stats */
  #over { position:fixed; inset:0; background:#000d; display:none; align-items:flex-start; justify-content:center; z-index:20; padding:16px; overflow-y:auto; touch-action:pan-y; }
  #over.show { display:flex; }
  #why { position:fixed; inset:0; background:#000b; display:none; align-items:flex-start; justify-content:center; z-index:25; padding:16px; overflow-y:auto; }
  #why.show { display:flex; }
  #why .panel { margin:auto; max-width:520px; }
  #why h2 { margin:0 0 6px; color:var(--accent, #ffd166); font-size:20px; }
  #whyBody p { margin:8px 0; line-height:1.45; }
  .whyEq { display:inline-flex; align-items:center; gap:.3em; font-weight:bold; white-space:nowrap; background:#0003; padding:1px 8px; border-radius:4px; }
  .whyEq .frac { font-size:.85em; }
  .whyBtn { margin-left:6px; font:inherit; font-size:.85em; padding:1px 10px; border:2px solid currentColor; background:transparent; color:inherit; cursor:pointer; border-radius:4px; }
  .panel { background:var(--panel); border:3px solid #000; max-width:640px; width:100%; margin:auto; padding:20px 22px; display:flex; flex-direction:column; gap:12px; }
  .panel h1 { margin:0; font-size:26px; color:var(--accent); }
  .panel h2 { margin:0; font-size:18px; color:var(--muted); font-weight:normal; }
  .panel p { margin:0; line-height:1.45; font-size:16px; }
  .panel .example { background:#0004; padding:10px 12px; font-size:18px; line-height:1.6; border-left:4px solid var(--accent); }
  .panel .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .statrow { border-top:2px solid #0006; padding-top:10px; display:flex; flex-direction:column; gap:6px; }
  .statrow .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .statrow .meter { width:160px; height:14px; }
  .statrow dl { display:grid; grid-template-columns: max-content 1fr; gap:2px 14px; margin:0; font-size:14px; }
  .statrow dt { color:var(--muted); } .statrow dd { margin:0; }

  /* ---------- phones ---------- */
  .short { display:none; }
  button, .card, .speed button { touch-action:none; }
  @supports (height: 100dvh) { #app { height:100dvh; } }

  /* Portrait phones and narrow windows */
  @media (max-width: 640px) {
    :root { --eqSize: clamp(26px, min(10vw, 5.5vh), 48px); }
    #app { padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:5px; }
    header { gap:6px; flex-wrap:nowrap; }
    .hpwrap { gap:6px; flex:1; min-width:0; font-size:13px; }
    .hpbar { width:auto; flex:1; min-width:60px; }
    .speed { gap:3px; }
    .speed button, .topbtn { font-size:13px; padding:6px 7px; min-height:36px; }
    .long, .lbl, .help { display:none; }
    .short { display:inline; }
    #map { gap:2px; }
    #map .node { width:19px; height:19px; font-size:10px; border-width:1px; border-radius:4px; }
    #map .node.cur { transform:scale(1.2); }
    #map .link { width:2px; }
    #skills { gap:2px 10px; font-size:10px; }
    #skills .meter { width:40px; }
    #arena { min-height:0; gap:4px; }
    #foe { font-size:12px; }
    #enemyBox svg { width:52px; height:52px; }
    .tok { min-height:calc(var(--eqSize) * 1.7); min-width:calc(var(--eqSize) * 1.1); padding:6px 5px; border-width:3px; }
    .tok.eq { padding:6px 3px; }
    #step, #msg, #unlock { font-size:13px; }
    /* In the flow on phones, so it sits under the solve message instead of on top of it. */
    #next { position:static; font-size:12px; }
    #arena:has(#next.show) #foe, #arena:has(#next.show) #enemyBox { display:none; }
    #equation.solved { padding-bottom:0; } #equation.solved .tok { min-height:0; }
    .key { font-size:11px; gap:10px; }
    .key .badge { font-size:12px; }
    #hand { gap:5px; flex-wrap:nowrap; min-height:0; padding-bottom:0; }
    .card { width:calc((100vw - 16px - 5px * (var(--n, 4) - 1)) / var(--n, 4)); max-width:110px; height:clamp(112px, 19vh, 150px); font-size:clamp(16px, 5vw, 22px); padding:4px 3px; }
    .card .badge { font-size:10px; top:3px; right:3px; padding:0 3px; border-width:1.5px; }
    .cicon { font-size:16px; margin-bottom:2px; }
    .card small { font-size:clamp(9px, 2.7vw, 11px); margin-top:4px; }
    /* 5 or 6 cards: two rows of 3 so each card stays wide enough to read and tap */
    #hand.many { flex-wrap:wrap; row-gap:5px; }
    #hand.many .card { width:calc((100vw - 16px - 10px) / 3); max-width:140px; height:clamp(94px, 14.5vh, 118px); justify-content:flex-start; padding-top:5px; }
    #hand.many .cicon { font-size:13px; margin-bottom:1px; }
    #hand.many .card small { margin-top:2px; }
    .card:hover { transform:none; }
    .panel { padding:14px; gap:10px; }
    .panel h1 { font-size:21px; } .panel p { font-size:14px; } .panel .example { font-size:15px; }
    .statrow .meter { width:90px; }
    .statrow dl { font-size:12px; }
    button { font-size:16px; padding:10px 14px; }
  }

  /* Landscape phones: the hand moves to a column on the right so the equation keeps the height */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --eqSize: clamp(22px, 9vh, 40px); }
    #app { max-width:none; display:grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto minmax(0, 1fr);
           gap:4px 10px; padding:6px max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left)); }
    header { grid-column:1 / -1; grid-row:1; flex-wrap:nowrap; gap:8px; }
    .hpwrap { flex:1; } .hpbar { flex:1; width:auto; max-width:220px; }
    .speed button, .topbtn { font-size:13px; padding:5px 8px; min-height:34px; }
    .lbl, .help, .long { display:none; }
    .short { display:inline; }
    #map { grid-column:1; grid-row:2; gap:2px; }
    #map .node { width:20px; height:20px; font-size:11px; border-width:1px; }
    #map .link { width:3px; }
    #skills { grid-column:1; grid-row:3; font-size:10px; gap:2px 10px; }
    #skills .meter { width:44px; }
    #arena { grid-column:1; grid-row:4; min-height:0; gap:2px; }
    #foe { font-size:11px; min-height:0; }
    #enemyBox svg { width:40px; height:40px; }
    .tok { min-height:calc(var(--eqSize) * 1.6); min-width:calc(var(--eqSize) * 1.1); padding:4px 5px; border-width:3px; }
    .tok.eq { padding:4px 3px; }
    #step, #msg, #unlock { font-size:12px; min-height:0; }
    #next { position:static; font-size:12px; }
    #arena:has(#next.show) #foe, #arena:has(#next.show) #enemyBox { display:none; }
    #equation.solved { padding-bottom:0; } #equation.solved .tok { min-height:0; }
    .key { grid-column:2; grid-row:2 / 4; flex-direction:column; align-items:flex-start; gap:0; font-size:10px; justify-content:center; }
    .key b { display:none; }
    .key .badge { font-size:11px; }
    #hand { grid-column:2; grid-row:4; display:grid; grid-template-columns: repeat(2, clamp(96px, 15vw, 130px)); grid-auto-rows: minmax(0, 1fr);
            gap:6px; min-height:0; padding:0; align-content:stretch; }
    .card { width:auto; height:auto; min-height:0; font-size:clamp(16px, 5.5vh, 24px); padding:3px; }
    .card .badge { font-size:10px; top:2px; right:2px; padding:0 3px; border-width:1.5px; }
    .cicon { font-size:14px; margin-bottom:1px; }
    .card small { font-size:10px; margin-top:2px; line-height:1.15; }
    /* Review fix: the portrait rules for 5–6 card hands (#hand.many, max-width 640px) also matched short
       landscape phones and made cards wider than their grid columns, so the hand ran off the right edge. */
    #hand .card, #hand.many .card { width:auto; max-width:none; height:auto; justify-content:center; padding:3px; }
    /* Cards are short here: long descriptions are cut to two lines, and dropped for 5–6 card hands (the big label stays). */
    .card small { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    #hand.many .card small { display:none; }
    .card:hover { transform:none; }
    .panel { padding:12px 14px; gap:8px; }
    .panel h1 { font-size:20px; } .panel p { font-size:13px; } .panel .example { font-size:14px; padding:6px 10px; }
    .statrow { padding-top:6px; } .statrow dl { font-size:12px; }
    button { font-size:15px; padding:8px 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hpwrap">HP <div class="hpbar"><div class="hpfill" id="hpfill"></div><div class="hptext" id="hptext"></div></div></div>
    <div class="speed"><span class="lbl">Animation speed</span> <button data-speed="0.5">0.5x</button><button data-speed="1">1x</button><button data-speed="2">2x</button></div>
    <button class="topbtn ghost" id="statsBtn"><span class="long">Skills &amp; stats</span><span class="short">Stats</span></button>
  </header>
  <div id="map"></div>
  <div id="skills"></div>
  <div id="arena">
    <div id="foe"></div>
    <!-- stand-in enemy art (swap for PNGs later) -->
    <div id="enemyBox"></div>
    <div id="equation"></div>
    <div id="step"></div>
    <div id="msg"></div>
    <div id="unlock"></div>
    <div id="celebrate"></div>
    <div id="next">Tap anywhere to continue</div>
  </div>
  <div class="help" id="helpLine">Pick the move that gets x alone. Wrong move = 10 damage.</div>
  <div class="key"><button id="keyBtn" class="keyBtn">Key</button> <span><span class="badge both">⇔</span> both sides<span class="lbl">: drop anywhere on the enemy</span></span> <span><span class="badge part">◎</span> one part<span class="lbl">: drop on that part of the equation</span></span></div>
  <div id="hand"></div>
</div>
<div id="over"><div class="panel" id="overPanel"></div></div>
<div id="why"><div class="panel"><h2 id="whyTitle">Why that didn't work</h2><div id="whyBody"></div><div class="buttons"><button id="whyClose">Got it</button></div></div></div>
<script>
// =====================================================================
//  Small helpers
// =====================================================================
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rand(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const nonZero = (a, b) => { let v; do { v = rand(a, b); } while (v === 0); return v; };
const MINUS = '−', TIMES = '×', DIV = '÷';
const $ = id => document.getElementById(id);

// Fractions {n, d}, always reduced with d > 0.
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
const fAdd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const fMul = (a, b) => F(a.n * b.n, a.d * b.d);
const fIs = (a, n, d = 1) => a.n === n && a.d === d;
const isInt = a => a.d === 1;
const fAbs = a => F(Math.abs(a.n), a.d);
const numText = n => n < 0 ? MINUS + Math.abs(n) : String(n);
const fracText = f => f.d === 1 ? numText(f.n) : (f.n < 0 ? MINUS : '') + Math.abs(f.n) + '/' + f.d;
const fracHtml = f => f.d === 1 ? numText(f.n) : (f.n < 0 ? MINUS : '') + `<span class="frac"><span>${Math.abs(f.n)}</span><span>${f.d}</span></span>`;
const paren = (f, html) => f.n < 0 ? `(${html ? fracHtml(f) : fracText(f)})` : (html ? fracHtml(f) : fracText(f));

// =====================================================================
//  Equations
// =====================================================================
// Every Act 1 equation has the shape   coef·x + b = c   (x side may be on the right).
//   state = { coef: F, b: F, c: F, xLeft: bool, constFirst: bool }
// constFirst writes the x side as "b + coef·x" (for 5 − x = 2).
function st(coef, b, c, opts = {}) {
  return { coef: typeof coef === 'number' ? F(coef) : coef, b: F(b), c: F(c),
           xLeft: opts.xLeft ?? Math.random() >= 0.3, constFirst: !!opts.constFirst && b !== 0 };
}

// Cards: {op:'+'|'-'|'*'|'/', n}  or {op:'neg'} (multiply by −1)  or {op:'frac', n, d} (multiply by n/d).
const cardFactor = c => ({ '*': F(c.n), '/': F(1, c.n), neg: F(-1), frac: F(c.n, c.d) })[c.op];
function applyCard(s, c) {
  const r = { ...s };
  if (c.op === '+' || c.op === '-') { const a = F(c.op === '+' ? c.n : -c.n); r.b = fAdd(s.b, a); r.c = fAdd(s.c, a); }
  else { const m = cardFactor(c); r.coef = fMul(s.coef, m); r.b = fMul(s.b, m); r.c = fMul(s.c, m); }
  if (r.b.n === 0) r.constFirst = false;
  return r;
}
const stepsLeft = s => (s.b.n !== 0 ? 1 : 0) + (fIs(s.coef, 1) ? 0 : 1);

// The one move the game expects next: undo + and − first, then × and ÷.
function correctMove(s) {
  if (s.b.n !== 0) return s.b.n > 0 ? { op: '-', n: s.b.n } : { op: '+', n: -s.b.n };
  const { n, d } = s.coef;
  if (d === 1) return n === -1 ? { op: 'neg' } : { op: '/', n };
  if (Math.abs(n) === 1) return { op: '*', n: n * d };
  return { op: 'frac', n: Math.sign(n) * d, d: Math.abs(n) };   // the reciprocal
}
const isNegFracMove = m => m.op === 'neg' || m.op === 'frac' || ((m.op === '*' || m.op === '/') && m.n < 0);

// Walks the solution and tags each step with the skill it exercises.
function makeEquation(s, enemy) {
  const path = []; let cur = s; const total = stepsLeft(s);
  while (stepsLeft(cur) > 0 && path.length < 4) {
    const move = correctMove(cur);
    const skill = isNegFracMove(move) ? 'negfrac' : total > 1 ? 'twostep' : 'onestep';
    path.push({ state: cur, move, skill });
    cur = applyCard(cur, move);
  }
  return { start: s, path, answer: cur.c, enemy, skills: [...new Set(path.map(p => p.skill))] };
}

// ---------- Generators, one per stage ----------
// Stage 1: one-step.  x + a = b, a + x = b, x − a = b, −a + x = b, ax = b, x ÷ a = b
// (Any of them can also come with x on the right: the variety picker mirrors equations.)
function genOneStep(type) {
  for (;;) {
    const t = type || pick(['add', 'addFront', 'sub', 'subFront', 'mul', 'div']);
    const x = rand(1, 12);
    if (t === 'add' || t === 'addFront') { const a = rand(1, 12); if (a === x + a) continue; return { s: st(1, a, x + a, { constFirst: t === 'addFront' }), enemy: 'inkling' }; }
    if (t === 'sub' || t === 'subFront') { let a = rand(1, 12); if (x - a < 0) a = rand(1, x); const c = x - a; if (c < 2 || c === a) continue; return { s: st(1, -a, c, { constFirst: t === 'subFront' }), enemy: 'inkling' }; }
    if (t === 'mul') { const a = rand(2, 10); if (x < 2 || x === 1) continue; return { s: st(a, 0, a * x), enemy: 'doubler' }; }
    const a = rand(2, 10), k = rand(2, 10); if (k === a) continue;
    return { s: st(F(1, a), 0, k), enemy: 'doubler' };
  }
}
// Stage 2: two-step.  ax + b = c, ax − b = c, x ÷ a + b = c, x ÷ a − b = c, and each of those with the
// number written first: b + ax = c, −b + ax = c, b + x ÷ a = c, −b + x ÷ a = c
function genTwoStep(type, big) {
  const hi = big ? 15 : 10;
  for (;;) {
    const t = type || pick(['axb', 'axmb', 'xdivb', 'xdivmb', 'bax', 'mbax', 'bxdiv', 'mbxdiv']);
    const front = ['bax', 'mbax', 'bxdiv', 'mbxdiv'].includes(t);
    if (t === 'axb' || t === 'bax') {
      const a = rand(2, 6), x = rand(1, hi), b = rand(1, 12); if (b % a === 0) continue;
      return { s: st(a, b, a * x + b, { constFirst: front }), enemy: 'doubler' };
    }
    if (t === 'axmb' || t === 'mbax') { const a = rand(2, 6), x = rand(2, hi), b = rand(1, 12); if (b % a === 0 || a * x - b < 1) continue; return { s: st(a, -b, a * x - b, { constFirst: front }), enemy: 'doubler' }; }
    const a = rand(2, 5);
    if (t === 'xdivb' || t === 'bxdiv') { const k = rand(1, 8), b = rand(1, 9); return { s: st(F(1, a), b, k + b, { constFirst: front }), enemy: 'inkling' }; }
    const k = rand(3, hi), b = rand(1, k - 1); return { s: st(F(1, a), -b, k - b, { constFirst: front }), enemy: 'inkling' };
  }
}
// Stage 3: negatives and fractions.  −x = a, a − x = c, −x + a = c, −nx = c, −x/n = c, (p/q)x = c
const FRACS = [[2, 3], [3, 4], [2, 5], [3, 2], [4, 3], [3, 5], [5, 2], [5, 3]];
function genNegFrac(type) {
  const t = type || pick(['negx', 'aminusx', 'negxa', 'negnx', 'negdiv', 'frac']);
  if (t === 'negx') { const x = nonZero(-12, 12); return { s: st(-1, 0, -x), enemy: 'minusmite' }; }
  if (t === 'aminusx' || t === 'negxa') { const a = rand(3, 15); let x; do { x = nonZero(-5, 15); } while (x === a); return { s: st(-1, a, a - x, { constFirst: t === 'aminusx' }), enemy: 'minusmite' }; }
  if (t === 'negdiv') { const n = rand(2, 6), k = nonZero(-9, 9); return { s: st(F(-1, n), 0, k), enemy: 'minusmite' }; }   // −x/4 = 3: multiply by −4
  if (t === 'negnx') { const n = rand(2, 9), x = nonZero(-10, 10); return { s: st(-n, 0, -n * x), enemy: 'minusmite' }; }
  const [p, q] = pick(FRACS), k = rand(1, 6); return { s: st(F(p, q), 0, p * k), enemy: 'minusmite' };
}
// Elites stack the two newest concepts in one equation.
function genStacked(skills) {
  if (skills.includes('negfrac')) {
    for (;;) {
      const t = pick(['bminusnx', 'negnxb', 'fracb', 'negdivb']);
      if (t === 'negdivb') { const n = rand(2, 5), k = nonZero(-8, 8), b = rand(1, 12) * pick([1, -1]); return { s: st(F(-1, n), b, k + b, { constFirst: Math.random() < 0.4 }), enemy: 'stacker' }; }
      if (t === 'bminusnx') { const n = rand(2, 6), b = rand(5, 20), x = rand(1, 8); if (b % n === 0) continue; return { s: st(-n, b, b - n * x, { constFirst: true }), enemy: 'stacker' }; }
      if (t === 'negnxb') { const n = rand(2, 6), x = nonZero(-6, 8), b = rand(1, 12) * pick([1, -1]); if (b % n === 0) continue; return { s: st(-n, b, -n * x + b), enemy: 'stacker' }; }
      const [p, q] = pick(FRACS), k = rand(1, 5), b = rand(1, 9) * pick([1, -1]);
      return { s: st(F(p, q), b, p * k + b, { constFirst: Math.random() < 0.4 }), enemy: 'stacker' };
    }
  }
  if (skills.includes('twostep')) return { ...genTwoStep(null, true), enemy: 'stacker' };
  return { ...genOneStep(), enemy: 'stacker' };
}

// =====================================================================
//  Difficulty
// =====================================================================
// Picked at the start of each run (like ascension levels). Easy is the original game. The same
// stages get harder numbers, more cards in the hand, and bigger mastery gains. Act 2 generators can
// read `difficulty` too: steps (extra steps), highlight ('on' | 'afterWrong' | 'off') are for them,
// since Act 1's one- and two-step shapes have no room for extra steps.
const DIFFICULTIES = [
  { level: 0, name: 'Easy',   max: 12, neg: false, fracAnswers: false, hand: 4, gain: 1,    steps: 0, highlight: 'on',
    desc: 'Whole numbers 1 to 12 with positive answers.' },
  { level: 1, name: 'Normal', max: 20, neg: true,  fracAnswers: false, hand: 4, gain: 1.25, steps: 1, highlight: 'on',
    desc: 'Numbers up to 20, negative numbers and answers. Mastery ×1.25.' },
  { level: 2, name: 'Hard',   max: 50, neg: true,  fracAnswers: false, hand: 5, gain: 1.5,  steps: 2, highlight: 'afterWrong',
    desc: 'Numbers up to 50 and 5 cards to choose from. Mastery ×1.5.' },
  { level: 3, name: 'Expert', max: 50, neg: true,  fracAnswers: true,  hand: 6, gain: 2,    steps: 3, highlight: 'off',
    desc: 'Answers can be fractions (x = −7/3) and 6 cards to choose from. Mastery ×2.' },
];
let difficulty = DIFFICULTIES[0];
try { difficulty = DIFFICULTIES[+localStorage.getItem('algebraCards.difficulty')] || DIFFICULTIES[0]; } catch (e) {}

// Re-rolls an Act 1 equation's numbers for the current difficulty, keeping its shape (which terms
// exist, where x is), so the stage's concept stays the same. Every level teaches all the material:
// Easy also sees small negative answers and simple fraction answers (x = 3/2); harder levels use bigger
// numbers, and Expert adds messy fraction answers (x = −17/6). Tutorials skip this and stay simple.
const COEF_MAX = [10, 12, 15, 20];   // biggest multiplier or divisor per level
const ANSWER_MIX = [                 // chance of each kind of answer per level; the rest are positive whole numbers
  { neg: .15, frac: .12 }, { neg: .4, frac: .15 }, { neg: .4, frac: .15 }, { messy: .35, frac: .15, neg: .3 }];
function answerKind(D, canFrac) {
  let r = Math.random();
  for (const [k, w] of Object.entries(ANSWER_MIX[D.level])) { if (k === 'frac' && !canFrac) continue; if ((r -= w) < 0) return k; }
  return 'pos';
}
function applyDifficulty(s) {
  const D = difficulty, N = D.level ? D.max : 12, C = COEF_MAX[D.level];
  const kind = answerKind(D, Math.abs(s.coef.n) > 1);    // 2x, −3x, (2/3)x: a fraction answer can come out
  if (!D.level && kind === 'pos') return s;               // Easy keeps the stage's own numbers
  const cMax = D.level ? N : 150;
  for (let tries = 0; tries < 400; tries++) {
    let a = s.coef, b = s.b;
    if (D.level) {                                         // bigger multipliers and divisors, same sign
      if (a.d === 1 && Math.abs(a.n) > 1) a = F(Math.sign(a.n) * rand(2, C));
      else if (Math.abs(a.n) === 1 && a.d > 1) a = F(a.n, rand(2, C));
      if (b.n !== 0) b = F(D.neg ? nonZero(-N, N) : rand(1, N));
    }
    if (isInt(a) && Math.abs(a.n) > 1 && b.n !== 0 && b.n % a.n === 0) continue;   // keep "undo + or − first" a real lesson
    let x;
    if (kind === 'messy') {
      const c = F(nonZero(-N, N)); x = fMul(fAdd(c, F(-b.n, b.d)), F(a.d, a.n));
      if (x.n === 0 || (isInt(x) && Math.random() < 0.6)) continue;
    } else if (kind === 'frac') {                          // a simple fraction: halves, thirds or quarters
      const q = pick([2, 3, 4]);
      if (isInt(a)) a = F(Math.sign(a.n) * q * rand(1, Math.max(1, Math.floor(C / q))));   // so a·x comes out whole
      if (Math.abs(a.n) < 2) continue;
      const p = rand(1, 3 * q) * (D.level && Math.random() < 0.4 ? -1 : 1);
      if (gcd(p, q) !== 1) continue;
      x = F(p, q);
      if (isInt(a) && b.n !== 0 && b.n % a.n === 0) continue;
    } else {
      const k = Math.max(1, Math.floor((D.level ? N : 9) / a.d));
      x = F((kind === 'neg' ? -1 : 1) * rand(1, k) * a.d);   // x/q needs x to be a multiple of q
    }
    const c = fAdd(fMul(a, x), b);
    if (!isInt(c) || c.n === 0 || Math.abs(c.n) > cMax || fIs(c, b.n, b.d)) continue;
    if (kind !== 'messy' && kind !== 'frac' && !isInt(x)) continue;
    return { ...s, coef: a, b, c };
  }
  return s;
}

// Each stage has a list of cases (the shapes of problem it teaches). Normal fights go through every case
// in a shuffled cycle at every difficulty, and a stage can't reach mastered until each case has been
// solved once. nextCase(id) gives the next one (the same one until it's used, since freshEquation may
// generate several candidates); generators return it as g.case.
const caseQueues = {};
function nextCase(id) {
  const all = SKILL[id].cases;
  if (!all) return undefined;
  const done = progress.skills[id].casesSolved || [];
  let q = caseQueues[id];
  if (!q || !q.length) {                                    // a new cycle, unsolved cases first
    q = caseQueues[id] = [...shuffle(all.filter(c => !done.includes(c))), ...shuffle(all.filter(c => done.includes(c)))];
  }
  return q[0];                                              // taken off the queue once the equation is used (useCase)
}
function useCase(id, c) { const q = caseQueues[id]; const i = q ? q.indexOf(c) : -1; if (i >= 0) q.splice(i, 1); }
const casesLeft = id => (SKILL[id].cases || []).filter(c => !(progress.skills[id].casesSolved || []).includes(c));
// A skill's normal-fight generator: takes the next case and tags the equation with it.
const cycled = (id, gen) => () => { const c = nextCase(id); const g = gen(c); return { ...g, case: c, caseSkill: id }; };

// =====================================================================
//  Skills, stages and saved progress
// =====================================================================
const SKILLS = [
  { id: 'onestep', stage: 1, name: 'One-step', cases: ['add', 'addFront', 'sub', 'mul', 'div'], gen: cycled('onestep', genOneStep),
    title: 'Stage 1: One-step equations',
    intro: 'Each enemy is an equation. Get x alone by doing the same thing to both sides. Pick the card that undoes what is attached to x: subtracting undoes adding, dividing undoes multiplying.',
    example: 'x + 3 = 7<br>Subtract 3 from both sides<br>x = 4',
    tutorial: [() => genOneStep('add'), () => genOneStep('mul')] },
  { id: 'twostep', stage: 2, name: 'Two-step', cases: ['axb', 'axmb', 'xdivb', 'xdivmb', 'bax', 'mbax', 'bxdiv', 'mbxdiv'], gen: cycled('twostep', genTwoStep),
    title: 'Stage 2: Two-step equations',
    intro: 'Now x has two things attached. Undo the + or − first, then the × or ÷. No new cards: the order is the new idea.',
    example: '3x + 4 = 19<br>Subtract 4 from both sides → 3x = 15<br>Divide both sides by 3 → x = 5',
    tutorial: [() => genTwoStep('axb'), () => genTwoStep('xdivmb')] },
  { id: 'negfrac', stage: 3, name: 'Negatives & fractions', cases: ['negx', 'aminusx', 'negxa', 'negnx', 'negdiv', 'frac'], gen: cycled('negfrac', genNegFrac),
    title: 'Stage 3: Negatives and fractions',
    intro: 'Two new cards. "Multiply both sides by −1" flips every sign, so −x becomes x. "Multiply by the reciprocal" flips a fraction over, and a fraction times its reciprocal is 1.',
    example: '−x = 5<br>Multiply both sides by −1 → x = −5<br><br>(2/3)x = 8<br>Multiply both sides by 3/2 → x = 12',
    tutorial: [() => genNegFrac('negx'), () => genNegFrac('frac')] },
];
const SKILL = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const MASTERED = 80;
// Par is the fewest moves, and wrong moves never change the equation, so "at par" is the same as
// "no wrong moves". The old separate +5 par bonus could never pay out on its own, so it is folded in here.
const MASTERY = { clean: 25, wrong: -10, weeklyDecay: -5, reviewFloor: 60 };

const STORE_KEY = 'algebraCards.progress.v1';
const blankSkill = () => ({ mastery: 0, everMastered: false, attempted: 0, solved: 0, wrongByCard: {},
  parDiffTotal: 0, parCount: 0, secondsTotal: 0, movesTimed: 0, hints: 0, lastPracticed: null, decayWeeks: 0, casesSolved: [] });
function loadProgress() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  p = p && typeof p === 'object' ? p : {};
  // A save can be old, hand-edited or corrupt, so every field is type-checked and clamped before use.
  // Without this, one bad value (e.g. an unparseable date) turned mastery into NaN for good.
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const num = (v, def, lo = 0, hi = Infinity) => Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def;
  if (!isObj(p.skills)) p.skills = {};
  for (const s of SKILLS) {
    const raw = isObj(p.skills[s.id]) ? p.skills[s.id] : {}, b = blankSkill(), k = { ...b, ...raw };
    k.mastery = num(k.mastery, 0, 0, 100);
    for (const f of ['attempted', 'solved', 'parCount', 'secondsTotal', 'movesTimed', 'hints', 'decayWeeks']) k[f] = num(k[f], 0);
    k.parDiffTotal = num(k.parDiffTotal, 0, -Infinity);
    k.everMastered = k.everMastered === true;
    k.casesSolved = Array.isArray(k.casesSolved) ? k.casesSolved.filter(c => (s.cases || []).includes(c)) : [];
    k.wrongByCard = isObj(k.wrongByCard) ? Object.fromEntries(Object.entries(k.wrongByCard).filter(([, v]) => Number.isFinite(v))) : {};
    k.lastPracticed = typeof k.lastPracticed === 'string' && Number.isFinite(Date.parse(k.lastPracticed)) ? k.lastPracticed : null;
    p.skills[s.id] = k;
  }
  const ids = SKILLS.map(s => s.id);
  p.unlocked = Array.isArray(p.unlocked) ? p.unlocked.filter(id => ids.includes(id)) : [];
  if (!p.unlocked.includes('onestep')) p.unlocked.unshift('onestep');
  p.levelUnlocked = Math.max(0, Math.min(3, Math.floor(+p.levelUnlocked) || 0));
  p.tutorialsDone = Array.isArray(p.tutorialsDone) ? p.tutorialsDone.filter(id => ids.includes(id)) : [];
  applyDecay(p);
  return p;
}
// Each week a skill goes unpracticed costs 5 mastery, down to 60 once it has been mastered.
function applyDecay(p) {
  const WEEK = 7 * 864e5;
  for (const s of Object.values(p.skills)) {
    if (!s.lastPracticed) continue;
    const weeks = Math.floor((Date.now() - Date.parse(s.lastPracticed)) / WEEK);
    const extra = weeks - (s.decayWeeks || 0);
    if (extra <= 0) continue;
    const dropped = s.mastery + MASTERY.weeklyDecay * extra;
    s.mastery = s.everMastered ? Math.max(Math.min(s.mastery, MASTERY.reviewFloor), dropped) : Math.max(0, dropped);
    s.decayWeeks = weeks;
  }
}
let progress = loadProgress();
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
const isUnlocked = id => progress.unlocked.includes(id);
const unlockedSkills = () => SKILLS.filter(s => isUnlocked(s.id)).map(s => s.id);
function skillStatus(id) {
  const s = progress.skills[id];
  if (!isUnlocked(id)) return 'locked';
  if (s.mastery >= MASTERED) return 'mastered';
  if (s.everMastered) return 'review';
  return 'learning';
}
function changeMastery(id, delta) {
  const s = progress.skills[id];

    : `${target.textContent.replace(/\s/g, '')} and ${cardLabel(card)} cancel`;
  mark([target, xNote], 'cancel');
  await quick(250);
  dropNote(xNote);
  await removeTok([target]);
  refreshXSide(ns);
  await combineOtherSide(s, ns, oNote, `${cancelText}, and ${fracText(s.c)} ${cardLabel(card).replace(/^(.)/, '$1 ')} = ${fracText(ns.c)}`);
}

// Divide both sides: a fraction bar with the divisor appears under each whole side, the matching
// numbers on the x side cancel to 1, and the other side divides out.
//   3x = 15  ->  (3x over 3) = (15 over 3)  ->  x = 5
async function divideAsFraction(card, s, ns) {
  const dn = paren(F(card.n));
  const xNote = note(dn, xSideEls(), { bar: true }), oNote = note(dn, [roleEl('other')], { bar: true });
  await showOperation(cardText(card));
  const coef = roleEl('coef'), ct = coef.textContent;
  mark([coef, xNote], 'cancel');
  await quick(250);
  dropNote(xNote);
  await removeTok([coef]);
  await combineOtherSide(s, ns, oNote, `${ct} over ${dn} is 1, and ${fracText(s.c)} over ${dn} = ${fracText(ns.c)}`);
}

// Stage 3, multiply by −1: "× (−1)" is written under both sides, then every sign flips in a quick ripple.
//   −x = 5  ->  x = −5
async function flipSigns(card, s, ns) {
  const notesHere = [note(chipHtml(card), xSideEls()), note(chipHtml(card), [roleEl('other')])];
  await showOperation(cardText(card));
  const fresh = tokensFor(ns);
  for (const t of [...$('equation').querySelectorAll('.tok')]) {
    const role = t.dataset.role;
    if (role === 'eq') continue;
    t.classList.add('flip');
    await quick(120);                       // halfway through the flip, the term shows its new sign
    const nt = fresh.find(f => f.role === role); if (nt) t.innerHTML = nt.html || nt.text;
    t.classList.add('merge');
    await quick(120);
  }
  notesHere.forEach(dropNote);
  caption(`Multiplying by ${MINUS}1 flips every sign: ${fracText(s.c)} × (${MINUS}1) = ${fracText(ns.c)}`);
  await quick(200);
  await hold();
}

// Stage 3, multiply by the reciprocal: the reciprocal is written under the fraction and under the other
// side; the fraction and its flipped twin spin together and cancel to 1.
//   (2/3)x = 8  ->  under 2/3 and under 8 write "× 3/2"  ->  x = 12
async function flipReciprocal(card, s, ns) {
  const coef = roleEl('coef'), f = F(card.n, card.d);
  const xNote = note(chipHtml(card), [coef]), oNote = note(chipHtml(card), [roleEl('other')]);
  await showOperation(`${cardText(card)} (${fracText(s.coef)} flipped over)`);
  mark([coef, xNote], 'spin');
  await quick(450);
  coef.classList.remove('spin'); xNote.classList.remove('spin');
  mark([coef, xNote], 'cancel');
  await quick(200);
  dropNote(xNote);
  coef.classList.remove('cancel'); coef.textContent = '1'; coef.classList.add('merge');
  await quick(200);
  await removeTok([coef]);
  await combineOtherSide(s, ns, oNote, `${fracText(s.coef)} × ${fracText(f)} = 1, and ${fracText(s.c)} × ${fracText(f)} = ${fracText(ns.c)}`);
}

// =====================================================================
//  Run, fights and phases
// =====================================================================
const MAX_HP = 100, DAMAGE = 10, ELITE_HEAL = 20;
// Acts. act2.js adds ACTS[2]. Every act uses the same map layout for now.
const ACTS = { 1: { name: 'The Ink Cellar', sub: 'Balancing', boss: 'The Scale Keeper', firstSkill: 'onestep',
  blurb: 'Equations have escaped their textbooks. Beat each one by getting x alone. Clear the map and defeat The Scale Keeper.' } };
const actOf = id => SKILL[id].act || 1;
const ACT1_LAYOUT = ['fight', 'fight', 'fight', 'elite', 'fight', 'fight', 'fight', 'elite', 'fight', 'fight', 'boss'];
const NODE_ICON = { tutorial: '★', fight: '⚔', elite: '☠', boss: '♛' };
let hp = MAX_HP, run = null, fight = null, cur = null, hand = [], busy = true;
// The engine for the current equation: Act 3 (inequalities) and Act 2 share an interface; Act 1 is built in here.
const eng = () => (cur && cur.act4 ? ACT4 : cur && cur.act3 ? ACT3 : ACT2);

// Starting a run first asks for a difficulty.
function newRun(act) {
  act = typeof act === 'number' ? act : 1;
  busy = true;
  const max = progress.levelUnlocked;
  const labels = DIFFICULTIES.map(d => `<span class="${d.level > max ? 'lockd' : ''}">${d.level > max ? '🔒 ' : ''}${d.name}</span>`).join('');
  showOverlay(`<h2>New run</h2><h1>Choose difficulty</h1>
    <div class="diff"><input type="range" id="diffRange" min="0" max="3" step="1" value="${Math.min(difficulty.level, max)}">
    <div class="diffLabels">${labels}</div></div>
    <p id="diffDesc"></p>
    <p class="help">Each level opens after a clean solve on a mastered stage at the level below.</p>`,
    [['Start', () => { const lvl = Math.min(+$('diffRange').value, max); startRun(act, lvl); }], ['Back', showTitle, true]]);
  const range = $('diffRange');
  const show = () => {
    if (+range.value > max) range.value = max;
    const d = DIFFICULTIES[+range.value];
    $('diffDesc').innerHTML = `<b>${d.name}:</b> ${d.desc}`;
  };
  range.addEventListener('input', show); show();
}
function startRun(act = 1, level = difficulty.level) {
  difficulty = DIFFICULTIES[level] || DIFFICULTIES[0];
  try { localStorage.setItem('algebraCards.difficulty', String(difficulty.level)); } catch (e) {}
  hp = MAX_HP;
  run = { act, nodes: ACT1_LAYOUT.map(type => ({ type })), i: 0 };
  // Any unlocked stage of this act whose tutorial hasn't been played yet goes first.
  const pending = runSkills().filter(id => actOf(id) === act && !progress.tutorialsDone.includes(id));
  run.nodes.unshift(...pending.map(skill => ({ type: 'tutorial', skill })));
  hideOverlay(); updateHud(); renderSkills(); startNode();
}

// Normal fights: ~60% the newest stage, ~40% review of earlier ones (needs-review skills weighted ×3).
// The skills a run can use: everything unlocked up to and including its act, oldest first.
const runSkills = () => unlockedSkills().filter(id => actOf(id) <= run.act);
function pickFightSkill() {
  const list = runSkills();
  if (list.length === 1 || Math.random() < 0.6) return list[list.length - 1];
  const earlier = list.slice(0, -1);
  const weights = earlier.map(id => skillStatus(id) === 'review' ? 3 : 1);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < earlier.length; i++) { r -= weights[i]; if (r <= 0) return earlier[i]; }
  return earlier[earlier.length - 1];
}

function buildFight(node) {
  const list = runSkills();
  if (node.type === 'tutorial') return { phases: SKILL[node.skill].tutorial, handSize: 3, rank: 'Tutorial' };
  if (node.type === 'fight') { const id = pickFightSkill(); return { phases: [SKILL[id].gen], handSize: difficulty.hand }; }
  if (run.act === 2) return ACT2.buildFight(node, list);
  if (run.act === 3) return ACT3.buildFight(node, list);
  if (run.act === 4) return ACT4.buildFight(node, list);
  if (node.type === 'elite') {
    const recent = list.slice(-2);
    const swapped = () => { const g = genOneStep(); g.s.xLeft = false; return g; };
    const phases = recent.length > 1 ? [() => genStacked(recent)] : [() => genOneStep(), swapped];   // one stage only: two equations back to back
    return { phases, handSize: difficulty.hand, enemy: 'stacker' };
  }
  // Boss: one phase per unlocked stage (sides swap from phase 2), then everything at once.
  const phases = list.map((id, i) => () => { const g = SKILL[id].gen(); if (i > 0) g.s.xLeft = false; return g; });
  phases.push(() => { const g = list.length > 1 ? genStacked(list.slice(-2)) : genOneStep(); g.s.xLeft = Math.random() < 0.5; return g; });
  if (list.length === 1) phases.splice(1, 0, () => { const g = genOneStep(); g.s.xLeft = false; return g; });
  return { phases, handSize: difficulty.hand, enemy: 'scalekeeper' };
}

// =====================================================================
//  Variety: no repeats, and the shapes keep changing
// =====================================================================
// Every fight in every act gets its equation through freshEquation(), which keeps a run from feeling
// repetitive:
//   - the same equation never comes up twice in one run,
//   - shapes rotate: an equation's shape is its text with the numbers blanked out, so "x + 3 = 10" and
//     "x + 8 = 2" share a shape but "10 = x + 3" and "3 + x = 10" don't. Each pick prefers the shape used
//     least so far this run, and never the shape just played,
//   - outside tutorials either side can hold x: equations are mirrored about half the time.
// It only needs to know how to write and mirror an equation, per engine (the key a generator returns
// its equation under): Act 1 is `s`; act2.js registers `eq`. A later act with its own equation model
// adds one line to ENGINES and gets all of this for free.
const ENGINES = {
  s: { text: s => tokensFor(s).map(t => t.text).join(' '), mirror: s => ({ ...s, xLeft: !s.xLeft }) },
};
const shapeOf = text => text.replace(/\d+/g, 'n');
function freshEquation(gen, { prepare = g => g, mirror = true, tries = 40 } = {}) {
  const v = run.variety || (run.variety = { seen: new Set(), shapes: new Map(), last: null });
  let best = null;
  for (let i = 0; i < tries; i++) {
    let g = prepare(gen());
    const kind = Object.keys(ENGINES).find(k => g[k]);
    if (!kind) return g;                                   // an engine nobody registered: no variety, but it still works
    const E = ENGINES[kind];
    if (mirror && E.mirror && Math.random() < 0.5) g = { ...g, [kind]: E.mirror(g[kind]) };
    const text = E.text(g[kind]), shape = shapeOf(text);
    if (v.seen.has(text)) continue;
    const score = (v.shapes.get(shape) || 0) + (shape === v.last ? 100 : 0);
    if (!best || score < best.score) best = { g, text, shape, score };
    if (score === 0) break;                                // a shape this run hasn't had yet
  }
  if (!best) return prepare(gen());                        // every try was a repeat (a tiny pool): allow one
  v.seen.add(best.text); v.shapes.set(best.shape, (v.shapes.get(best.shape) || 0) + 1); v.last = best.shape;
  return best.g;
}

function startNode() {
  const node = run.nodes[run.i];
  fight = { ...buildFight(node), node, phase: 0 };
  renderMap();
  $('enemyBox').classList.remove('dead');
  if (node.type === 'tutorial') showIntro(node.skill); else startPhase();
}

function startPhase() {
  const gen = fight.phases[fight.phase];
  // Tutorials stay on Easy and keep the shape they teach (no mirroring); they still never repeat.
  const tut = fight.node.type === 'tutorial';
  const prepare = g => {
    if (tut) return g;
    if (g.s) return { ...g, s: applyDifficulty(g.s) };
    if (g.eq) return ACT2.applyDifficulty(g, gen);
    if (g.ineq) return ACT3.applyDifficulty(g, gen);
    if (g.fn) return ACT4.applyDifficulty(g, gen);
    return g;
  };
  const g = freshEquation(gen, { prepare, mirror: !tut });
  const enemy = fight.enemy || g.enemy;
  // Act 3 generators return { ineq } (act3.js: Act 2's model plus a relation), Act 2 ones { eq } (act2.js's equation model), Act 1 ones { s }.
  cur = g.fn ? ACT4.makeEquation(g.fn, enemy) : g.ineq ? ACT3.makeEquation(g.ineq, enemy) : g.eq ? ACT2.makeEquation(g.eq, enemy) : makeEquation(g.s, enemy);
  // Playtest fix: Act 4 questions are evaluated, read off a graph or written as a line, not solved for x.
  $('helpLine').textContent = `Pick the ${cur.act4 && g.fn.k4 !== 'formula' ? 'right next move' : 'move that gets ' + ((g.fn || g.eq || {}).v || 'x') + ' alone'}. Wrong move = 10 damage.`;
  cur.state = g.fn || g.ineq || g.eq || g.s; cur.step = 0; cur.wrong = 0; cur.moves = 0; cur.lastT = performance.now();
  cur.case = g.case; cur.caseSkill = g.caseSkill; if (g.case) useCase(g.caseSkill, g.case);
  for (const id of cur.skills) progress.skills[id].attempted++;
  saveProgress();
  $('enemyBox').innerHTML = enemySvg(enemy);
  $('enemyBox').classList.remove('dead', 'hit');
  renderFoe();
  caption(''); setMsg(''); $('unlock').textContent = '';
  renderEquation(cur.state); dealHand(); busy = false;
  for (const id of ['foe', 'enemyBox', 'equation']) { const e = $(id); e.classList.remove('arrive'); void e.offsetWidth; e.classList.add('arrive'); }
}

function renderFoe() {
  const e = ENEMIES[cur.enemy], n = fight.phases.length;
  const rank = fight.rank || e.rank;
  const pips = n > 1 ? `<span class="pips">${'●'.repeat(fight.phase)}${'○'.repeat(n - fight.phase)}</span> phase ${fight.phase + 1}/${n}` : '';

}

};
// A trap card wears the icon of the move it imitates.
const TRAP_ICON = { 'add across': 'comb', 'first term only': 'dist', 'first sign only': 'dist', 'no sign flip': null, 'unlike terms': 'comb', 'lost sign': 'div', 'drop bars': 'split' };
function iconKey(c) {
  if (window.ACT4 && ACT4.icon(c)) return ACT4.icon(c);
  if (c.op === 'trap') {
    const k = TRAP_ICON[c.trap]; if (k) return k;
    const op = c.scaleOp || (c.trap === 'no sign flip' ? '+' : null);
    return op ? iconKey({ op }) : 'add';
  }
  if (c.flip) return 'flip';
  if (c.lcd) return 'lcd';
  if (c.op === 'frac') return 'recip';
  return { '+': 'add', '-': 'sub', '*': 'mul', '/': 'div', neg: 'neg', comb: 'comb', dist: 'dist', none: 'none', all: 'all', flip: 'flip', split: c.way === 'between' ? 'between' : c.way === 'outside' ? 'outside' : 'split' }[c.op] || 'add';
}
const cardIcon = c => { const k = iconKey(c); return `<span class="cicon k-${k}" aria-label="${CARD_ICONS[k].name}">${CARD_ICONS[k].svg}</span>`; };
function showKey() {
  const row = k => `<div class="keyRow"><span class="cicon k-${k}">${CARD_ICONS[k].svg}</span> ${CARD_ICONS[k].name}</div>`;
  showWhy(`<p><span class="badge both">⇔</span> <b>Both sides:</b> drop the card anywhere on the enemy.<br><span class="badge part">◎</span> <b>One part:</b> drop it on that part of the equation.</p>
    <div class="keyGrid">${Object.keys(CARD_ICONS).map(row).join('')}</div>`, 'Card key');
}

function dealHand() { hand = arrangeHand((cur.act2 ? eng().makeHand : makeHand)(cur.state, cur.path[cur.step].move, fight.handSize)); renderHand(); }

// Named operation cards (Combine, Distribute, LCD, ...) always land in the same slot, counting from the
// left, so a player can find them without reading every card after a redeal. Number cards fill the rest
// in their dealt order. New acts can add their own named ops to this list.
const FIXED_SLOTS = ['comb', 'dist', 'lcd', 'flip', 'split', 'none', 'all'];
const slotKey = c => c.lcd ? 'lcd' : c.op;
const slotOf = c => { const k = window.ACT4 ? ACT4.slot(c) : null; return k != null ? k : FIXED_SLOTS.indexOf(slotKey(c)); };   // Act 4 cards have their own slots (PEMDAS order)
function arrangeHand(cards) {
  const out = new Array(cards.length).fill(null), rest = [];
  const named = cards.filter(c => slotOf(c) >= 0).sort((a, b) => slotOf(a) - slotOf(b));
  for (const c of cards) if (!named.includes(c)) rest.push(c);
  for (const c of named) {                       // its own slot, or the nearest free one after it
    let i = Math.min(slotOf(c), cards.length - 1);
    while (out[i]) i = (i + 1) % cards.length;
    out[i] = c;
  }
  for (let i = 0; i < out.length; i++) if (!out[i]) out[i] = rest.shift();
  return out;
}

function renderHand() {
  const el = $('hand'); el.innerHTML = ''; el.style.setProperty('--n', String(Math.max(4, hand.length))); el.classList.toggle('many', hand.length >= 5);   // 5+ cards: two rows on phones
  hand.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'card deal'; d.dataset.idx = i; d.style.animationDelay = `calc(${i * 70}ms * var(--k))`;
    d.addEventListener('animationend', () => d.classList.remove('deal'), { once: true });
    const badge = scopeOf(c) === 'part' ? '<span class="badge part" title="One part: drop on that part">◎</span>' : '<span class="badge both" title="Both sides: drop anywhere">⇔</span>';
    d.innerHTML = `${badge}${cardIcon(c)}<span class="clabel">${cardLabel(c)}</span><small>${cardText(c)}</small>`;
    d.addEventListener('pointerdown', e => startDrag(e, d, c));
    el.appendChild(d);
  });
}

function renderMap() {
  $('map').innerHTML = `<span class="lbl">Act ${run.act} · ${ACTS[run.act].name}</span>&nbsp;` + run.nodes.map((n, i) =>
    `${i ? '<span class="link"></span>' : ''}<span class="node ${n.type} ${i < run.i ? 'done' : ''} ${i === run.i ? 'cur' : ''}" title="${n.type === 'tutorial' ? 'Tutorial: ' + SKILL[n.skill].name : n.type}">${NODE_ICON[n.type]}</span>`).join('') + `&nbsp;<span class="diffTag">${difficulty.name}</span>`;
}

function renderSkills(deltas = []) {
  const act = run ? run.act : 1;
  $('skills').innerHTML = SKILLS.filter(s => (s.act || 1) === act).map(s => {
    const p = progress.skills[s.id], status = skillStatus(s.id);

    const d = deltas.find(x => x[0] === s.id);

      ${s.stage}. ${s.name} <div class="meter"><div class="fill" style="width:${p.mastery}%"></div><div class="goal"></div></div> ${p.mastery} ${tag}${delta}</div>`;
  }).join('');
}

function updateHud() {
  $('hpfill').style.width = (hp / MAX_HP * 100) + '%';
  $('hptext').textContent = `${hp} / ${MAX_HP}`;
}
function setMsg(t, cls = '', why = null) {

  if (why) { const b = document.createElement('button'); b.className = 'whyBtn'; b.textContent = 'Why?';
    b.addEventListener('click', e => { e.stopPropagation(); showWhy(why); }); m.append(' ', b); }
