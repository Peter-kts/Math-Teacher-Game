// ---------- Drag & drop (pointer events: mouse + touch) ----------
// Two kinds of cards:
//   scope 'both' (default): does the same thing to both sides, so it can be dropped anywhere on the arena.
//   scope 'part': changes one part of the equation (Distribute, Combine like terms, Factor... for later
//                 acts), so it must be dropped on the right box. Act 1 only deals 'both' cards.
const scopeOf = c => c.scope || 'both';

let dragging = false;   // only one card can be dragged at a time
// The things a ◎ card can change, by kind: the bars for Split (and the drop-the-bars trap), parentheses for
// Distribute (and its traps), the sign for Flip (one flip turns every sign, so it counts once), pairs of like
// terms for Combine. Returns the one target (or null when there is none, so the move is wrong wherever it
// goes), or undefined when there are two or more and the player has to choose.
function autoTarget(card) {
  const q = sel => [...document.querySelectorAll('#equation ' + sel)];
  let things;
  if (card.op === 'flip') things = q('.tok.rel').slice(0, 1);
  else if (card.op === 'none' || card.op === 'all') return null;          // a verdict is about the whole statement
  else if (card.op === 'split' || (card.op === 'trap' && card.trap === 'drop bars')) things = q('[data-role="abs"]');
  else if (card.op === 'dist' || (card.op === 'trap' && /^first/.test(card.trap || ''))) things = q('[data-role="group"]');
  else if (card.op === 'comb') {
    const groups = {};
    for (const t of q('[data-role="xterm"], [data-role="const"]')) (groups[(t.dataset.side || '') + t.dataset.role] ||= []).push(t);
    things = Object.values(groups).filter(g => g.length >= 2).map(g => g[0]);
  } else return undefined;
  return things.length >= 2 ? undefined : things[0] || null;
}
function startDrag(e, el, card) {
  // A second finger on another card used to start a second drag, and one lift then played both cards.
  if (busy || dragging) return;
  dragging = true;
  const pid = e.pointerId;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  const offX = e.clientX - r.left, offY = e.clientY - r.top;
  const ghost = el.cloneNode(true);
  ghost.classList.add('dragging'); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
  document.body.appendChild(ghost);
  el.classList.add('placeholder');
  // A ◎ card only asks for a target when there is more than one thing it could change. With one (or none),
  // it drops anywhere like a ⇔ card and goes on that thing by itself.
  const auto = scopeOf(card) === 'part' ? autoTarget(card) : undefined;
  const targeted = scopeOf(card) === 'part' && auto === undefined;
  $('arena').classList.add(targeted ? 'targeting' : 'anywhere');
  if (window.ACT4) ACT4.onDrag(card, true);
  let hover = null;
  const move = ev => {
    if (ev.pointerId !== pid) return;   // ignore other fingers
    ghost.style.left = (ev.clientX - offX) + 'px'; ghost.style.top = (ev.clientY - offY) + 'px';
    let found = null;
    if (targeted) {
      // Forgiving hit test: within 40px of a box counts, closest box wins.
      let best = Infinity;
      // Act 3's Flip is dropped on the sign. Review fix: only Flip can target it; other ◎ cards used to snap onto it.
      const sel = (window.ACT4 && ACT4.targetSel(card)) || (card.op === 'flip' ? '#equation .tok:not(.eq), #equation .tok.rel' : '#equation .tok:not(.eq):not(.rel)');
      for (const t of document.querySelectorAll(sel)) {
        const b = t.getBoundingClientRect();
        const d = Math.hypot(Math.max(b.left - ev.clientX, 0, ev.clientX - b.right), Math.max(b.top - ev.clientY, 0, ev.clientY - b.bottom));
        const cd = Math.hypot(ev.clientX - (b.left + b.right) / 2, ev.clientY - (b.top + b.bottom) / 2);
        if (d <= 40 && cd < best) { best = cd; found = t; }
      }
    } else {
      const b = $('arena').getBoundingClientRect();
      if (ev.clientX >= b.left && ev.clientX <= b.right && ev.clientY >= b.top && ev.clientY <= b.bottom) found = $('arena');
    }
    if (hover && hover !== found) hover.classList.remove('hover');
    hover = found; if (found) found.classList.add('hover');
  };
  // pointerup drops the card. pointercancel (the OS took the touch: a call, a system gesture, palm
  // rejection) now just puts it back; it used to count as a drop and could cost HP.
  const end = (ev, drop) => {
    if (ev.pointerId !== pid) return;
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', cancel);
    dragging = false;
    ghost.remove(); el.classList.remove('placeholder');
    $('arena').classList.remove('targeting', 'anywhere');
    if (window.ACT4) ACT4.onDrag(card, false);
    if (hover) hover.classList.remove('hover');
    if (hover && drop) playCard(card, targeted ? hover : auto === undefined ? null : auto);
  };
  const up = ev => end(ev, true), cancel = ev => end(ev, false);
  move(e);
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', cancel);
}

// =====================================================================
//  Rules and mastery
// =====================================================================
// target: the equation part a ◎ card was dropped on (an element, or its data-ref).
function playCard(card, target) {
  if (busy) return;
  const step = cur.path[cur.step], sk = progress.skills[step.skill];
  const now = performance.now();
  sk.secondsTotal += (now - cur.lastT) / 1000; sk.movesTimed++; cur.lastT = now;
  sk.lastPracticed = new Date().toISOString(); sk.decayWeeks = 0;
  cur.moves++;
  const right = cur.act2 ? eng().isCorrect(cur, card, target) : sameCard(card, step.move);
  if (right) { saveProgress(); return doStep(card, target); }
  // Wrong move: -10 HP and -10 mastery on the skill this step uses.
  cur.wrong++;
  sk.wrongByCard[cardKind(card)] = (sk.wrongByCard[cardKind(card)] || 0) + 1;
  changeMastery(step.skill, MASTERY.wrong);
  saveProgress(); renderSkills([[step.skill, MASTERY.wrong]]);
  if (cur.act2) return takeDamage(eng().whyWrong(cur, card, target),
    explainWhy({ state: cur.state, card, correct: step.move, ref: target && target.dataset ? target.dataset.ref : target }));
  const s = cur.state, undo = correctMove({ ...s, b: F(0) });
  const why = s.b.n !== 0 && !fIs(s.coef, 1) && sameCard(card, undo)
    ? `That's allowed, but undo the + or ${MINUS} part first, then the ${TIMES} or ${DIV}.`
    : `That's allowed, but x still isn't alone: ${appliedText(s, card)}`;
  takeDamage(why, explainWhy({ state: s, card, correct: step.move }));
}

async function doStep(card, target) {
  busy = true; setMsg(''); hideWhy();
  const ref = target && target.dataset ? target.dataset.ref : target;
  const s = cur.state, ns = cur.act2 ? eng().apply(s, card, ref) : applyCard(s, card);
  const additive = card.op === '+' || card.op === '-';
  const note = cur.path.length > 1 && cur.step === 0 && additive ? ` (undo + and ${MINUS} first, then ${TIMES} and ${DIV})` : '';
  const anim = cur.act2 ? eng().animFor(card) : OPERATION_ANIMATIONS[card.op];
  if (cur.act2) eng().prefit(s, ns);   // size the equation once, before the animation
  animating = true;
  try { if (anim) await anim(card, s, ns, cur.act2 ? ref : note); } finally { animating = false; }
  cur.state = ns; cur.step++;
  if (cur.act2) eng().refreshPath(cur);
  cur.lastT = performance.now();   // start the next move's clock after the animation, not before it
  renderEquation(ns);
  if (cur.step < cur.path.length) { dealHand(); busy = false; return; }
  equationSolved();
}

function equationSolved() {
  const par = cur.path.length, clean = cur.wrong === 0;
  const deltas = [];
  for (const id of cur.skills) {
    const sk = progress.skills[id];
    sk.solved++; sk.parDiffTotal += cur.moves - par; sk.parCount++;
    if (id === cur.caseSkill && cur.case && !sk.casesSolved.includes(cur.case)) sk.casesSolved.push(cur.case);
    const d = clean ? Math.round(MASTERY.clean * difficulty.gain) : 0;
    if (d) changeMastery(id, d);
    deltas.push([id, d]);
  }
  const fresh = checkUnlocks();
  // A clean solve on a mastered stage opens the next difficulty.
  let newLevel = null;
  if (clean && difficulty.level === progress.levelUnlocked && progress.levelUnlocked < 3 &&
      cur.skills.some(id => progress.skills[id].mastery >= MASTERED)) newLevel = DIFFICULTIES[++progress.levelUnlocked];
  saveProgress(); renderSkills(deltas);
  const gains = deltas.filter(d => d[1]).map(d => `${SKILL[d[0]].name} +${d[1]}`).join(', ');
  // A stage held just under mastered says why: some kinds of problem haven't been solved yet.
  const held = cur.skills.filter(id => progress.skills[id].mastery === MASTERED - 1 && casesLeft(id).length);
  const heldNote = held.length ? ` · ${SKILL[held[0]].name}: ${casesLeft(held[0]).length} more kind${casesLeft(held[0]).length > 1 ? 's' : ''} of problem to solve before it's mastered` : '';
  setMsg(`Solved! ${cur.answerText || 'x = ' + fracText(cur.answer)}${gains ? ' · ' + gains : ''}${heldNote}`, 'good');
  // A stage of this act gets its tutorial fight next; a stage of a later act opens that act on the title screen.
  const here = fresh.filter(id => actOf(id) === run.act), later = fresh.filter(id => actOf(id) > run.act);
  for (const id of here) run.nodes.splice(run.i + 1, 0, { type: 'tutorial', skill: id });
  if (newLevel && !fresh.length) $('unlock').textContent = `${newLevel.name} difficulty unlocked! Pick it at the start of your next run.`;
  if (here.length) { renderMap(); $('unlock').textContent = `New stage unlocked: ${SKILL[here[0]].title.replace(/^Stage \d+: /, '')}! Its tutorial fight is next.`; }
  else if (later.length) $('unlock').textContent = `Act ${actOf(later[0])} unlocked! Start it from the title screen after this run.`;

  fight.phase++;
  if (fight.phase < fight.phases.length) {
    const b = $('enemyBox'); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
    return waitForNext(startPhase);
  }
  $('enemyBox').classList.add('dead');
  const node = fight.node;
  if (node.type === 'tutorial' && !progress.tutorialsDone.includes(node.skill)) { progress.tutorialsDone.push(node.skill); saveProgress(); }
  if (node.type === 'elite') { hp = Math.min(MAX_HP, hp + ELITE_HEAL); updateHud(); setMsg($('msg').textContent + ` · Elite down: +${ELITE_HEAL} HP`, 'good'); }
  if (node.type === 'boss') return waitForNext(actCleared);
  run.i++;
  waitForNext(startNode);
}

// why: the short reason shown under the equation. more: HTML for the "Why?" button (optional).
function takeDamage(why, more = null) {
  hp = Math.max(0, hp - DAMAGE); updateHud();
  setMsg(`-${DAMAGE} HP. ${why}`, 'bad', more);
  const a = $('arena'); a.classList.remove('flash', 'shake'); void a.offsetWidth; a.classList.add('flash', 'shake');
  if (hp <= 0) { busy = true; setTimeout(runLost, 600); }
}

// After a solve: a short celebration, then the game waits until the player taps (or presses Space/Enter).
let waiting = false, nextAction = null, waitingSince = 0;
function celebrate() {
  const box = $('celebrate'), arena = $('arena').getBoundingClientRect(), eqR = $('equation').getBoundingClientRect();
  const cx = eqR.left + eqR.width / 2 - arena.left, cy = eqR.top + eqR.height / 2 - arena.top;
  const colors = ['#ffd166', '#06d6a0', '#7bdff2', '#f1ecff', '#ef8fcf'];
  // Review fix: the stamp used to be clamped to the arena's top and cover the answer on short screens
  // (568x320, 844x390, and the wide verdict line on a 390x844 phone). placeStamp() sizes it to the room
  // above the equation (or puts it just below when there is almost none), and runs again once the layout
  // settles, since the tap prompt and the solved style move the equation after this point.
  let html = `<div class="stamp">SOLVED!</div>`;
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2 + Math.random() * 0.3, r = 110 + Math.random() * 130;
    html += `<span class="spark" style="left:${cx}px; top:${cy}px; background:${colors[i % colors.length]}; --dx:${Math.cos(a) * r}px; --dy:${Math.sin(a) * r}px"></span>`;
  }
  box.innerHTML = html;
  const eq = $('equation'); eq.classList.remove('solved'); void eq.offsetWidth; eq.classList.add('solved');
  requestAnimationFrame(placeStamp); setTimeout(placeStamp, 120); setTimeout(placeStamp, 450);
}
function placeStamp() {
  const st = document.querySelector('#celebrate .stamp'); if (!st) return;
  const arena = $('arena').getBoundingClientRect(), eqR = $('equation').getBoundingClientRect();
  const room = eqR.top - arena.top, big = Math.min(52, Math.max(28, innerWidth * 0.07)), fs = Math.min(big, (room - 6) / 1.3);
  if (fs >= 18) { st.style.fontSize = fs + 'px'; st.style.top = Math.max(2, room - fs * 1.3) + 'px'; }
  // Too little room above the answer (short landscape phones): tuck a small stamp into the arena's
  // top-right corner instead of dropping it below, where it would cover the number line.
  else { st.style.fontSize = '15px'; st.style.top = '9px'; st.style.textAlign = 'right'; st.style.paddingRight = '10px'; }
}
function waitForNext(action) {
  busy = true; nextAction = action; waiting = true;
  waitingSince = performance.now();
  celebrate();
  $('next').classList.add('show');
}
async function goNext() {
  if (!waiting) return;
  waiting = false;
  $('next').classList.remove('show');
  const a = nextAction; nextAction = null;
  // The finished question slides out before the next one slides in.
  const parts = ['foe', 'enemyBox', 'equation', 'cases', 'numline', 'a4top', 'graph', 'step', 'msg', 'unlock', 'celebrate'].map($).filter(Boolean);
  parts.forEach(p => p.classList.add('leave'));
  await sleep(350);
  parts.forEach(p => p.classList.remove('leave'));
  $('celebrate').innerHTML = ''; $('equation').classList.remove('solved');
  a();
}
// Taps: on the result screen a tap moves to the next question; during an animation it skips a step.
// Uses pointer events rather than click, because iOS Safari doesn't send click for taps on plain
// page areas. A press that moves more than a few pixels (a card drag) doesn't count as a tap.
let tapStart = null;
window.addEventListener('pointerdown', e => { tapStart = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
window.addEventListener('pointerup', e => {
  const t = tapStart; tapStart = null;
  if (!t || t.id !== e.pointerId || Math.hypot(e.clientX - t.x, e.clientY - t.y) > 12) return;
  if (e.target.closest('.speed, button, #over, #why, #dbgBtn')) return;
  // A short grace period stops a burst of skip taps from also skipping the result screen.
  if (waiting) { if (performance.now() - waitingSince > 500) goNext(); }
  else if (animating) skipStep();
});
window.addEventListener('keydown', e => { if (waiting && (e.key === ' ' || e.key === 'Enter') && !$('over').classList.contains('show')) { e.preventDefault(); goNext(); } });

// =====================================================================
//  Screens: title, tutorial intro, run end, stats
// =====================================================================
function showOverlay(html, buttons) {
  const p = $('overPanel'); p.innerHTML = html;
  const row = document.createElement('div'); row.className = 'buttons';
  for (const [label, fn, ghost] of buttons) {
    const b = document.createElement('button'); b.textContent = label; if (ghost) b.className = 'ghost';
    b.addEventListener('click', fn); row.appendChild(b);
  }
  p.appendChild(row);
  $('over').classList.add('show');
}
function hideOverlay() { $('over').classList.remove('show'); }

function skillSummaryHtml() {
  return SKILLS.map(s => {
    const p = progress.skills[s.id], st = skillStatus(s.id);
    const label = { locked: '🔒 locked', learning: 'learning', mastered: '✓ mastered', review: 'needs review' }[st];
    return `<div class="statrow"><div class="head"><b>${s.stage}. ${s.name}</b> <div class="meter"><div class="fill" style="width:${p.mastery}%"></div><div class="goal"></div></div> ${p.mastery}/100 · ${label}</div></div>`;
  }).join('');
}

function showTitle() {
  busy = true;
  // An act opens once its first stage is unlocked (80 mastery on the last stage of the act before).
  const open = Object.keys(ACTS).map(Number).filter(a => isUnlocked(ACTS[a].firstSkill));
  const top = open[open.length - 1], A = ACTS[top];
  const buttons = open.slice().reverse().map(a => [`Start Act ${a}`, () => newRun(a), a !== top]);
  buttons.push(['Skills & stats', () => showStats(showTitle), true]);
  // Review fix: testing-only, so it's shown only where the debug menu is (local file, /dev/, ?debug=1).
  // On the live site one tap used to unlock every stage for good.
  const debugOn = location.protocol === 'file:' || /\/dev\//.test(location.pathname) || /[?&]debug=1/.test(location.search);
  if (debugOn && SKILLS.some(s => !isUnlocked(s.id))) buttons.push(['Unlock all stages (testing)', () => {
    progress.unlocked = SKILLS.map(s => s.id); saveProgress(); renderSkills(); showTitle();
  }, true]);
  showOverlay(`<h1>Act ${top}: ${A.name}</h1><h2>${A.sub}</h2>
    <p>${A.blurb} Wrong moves cost 10 HP.</p>
    <p>Each stage unlocks when the one before it reaches 80 mastery: +25 for a fight with no wrong moves, −10 for each wrong move. Mastery is saved, even if you run out of HP.</p>
    ${skillSummaryHtml()}`, buttons);
}

function showIntro(id) {
  const s = SKILL[id];
  busy = true;
  showOverlay(`<h2>Tutorial fight</h2><h1>${s.title}</h1><p>${s.intro}</p><div class="example">${s.example}</div>`,
    [['Start', () => { hideOverlay(); startPhase(); }]]);
}

function runLost() {
  showOverlay(`<h1>Out of HP</h1><p>You reached node ${run.i + 1} of ${run.nodes.length}. Your mastery is saved, so the next run starts with every stage you've unlocked.</p>${skillSummaryHtml()}`,
    [['New run', () => newRun(run.act)], ['Title screen', showTitle, true], ['Skills & stats', () => showStats(runLost), true]]);
}

function actCleared() {
  $('next').classList.remove('show');
  const text = run.act === 1
    ? `The Scale Keeper is balanced at last. ${isUnlocked('liketerms') ? 'Act 2, the Bracket Halls, is open.' : 'Act 2, the Bracket Halls, opens when Negatives & fractions reaches 80 mastery.'}`
    : run.act === 2
    ? `The Archivist's shelves are back in order. ${isUnlocked('ineq') ? 'Act 3, the Leaning Stacks, is open.' : 'Act 3, the Leaning Stacks, opens when No solution / every x reaches 80 mastery.'}`
    : run.act === 3
    ? `The Leaning Tower stands straight again. ${isUnlocked('evalx') ? 'Act 4, the Map Room, is open.' : 'Act 4, the Map Room, opens when the last Act 3 skill reaches 80 mastery.'}`
    : 'The Cartographer\'s maps are true again. Act 5 is still to be built, so run Act 4 again to keep your skills sharp.';
  showOverlay(`<h1>Act ${run.act} cleared!</h1><p>${text}</p>${skillSummaryHtml()}`,
    [['New run', () => newRun(run.act)], ['Title screen', showTitle, true], ['Skills & stats', () => showStats(actCleared), true]]);
}

function fmtDate(iso) { return iso ? iso.slice(0, 10) : 'never'; }
function showStats(back) {
  const rows = SKILLS.map(s => {
    const p = progress.skills[s.id], st = skillStatus(s.id);
    const label = { locked: '🔒 locked', learning: 'learning', mastered: '✓ mastered', review: 'needs review' }[st];
    const wrong = Object.entries(p.wrongByCard).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(', ') || 'none';
    const par = p.parCount ? (p.parDiffTotal / p.parCount) : null;
    const secs = p.movesTimed ? (p.secondsTotal / p.movesTimed).toFixed(1) : '–';
    return `<div class="statrow"><div class="head"><b>${s.stage}. ${s.name}</b> <div class="meter"><div class="fill" style="width:${p.mastery}%"></div><div class="goal"></div></div> ${p.mastery}/100 · ${label}</div>
      <dl><dt>Skill tag</dt><dd>${s.id}</dd>
      <dt>Fights attempted / solved</dt><dd>${p.attempted} / ${p.solved}</dd>
      <dt>Wrong moves, by card</dt><dd>${wrong}</dd>
      <dt>Moves vs par (average)</dt><dd>${par === null ? '–' : (par >= 0 ? '+' : '') + par.toFixed(1)}</dd>
      <dt>Average seconds per move</dt><dd>${secs}</dd>
      <dt>Hints used</dt><dd>${p.hints}</dd>
      <dt>Last practiced</dt><dd>${fmtDate(p.lastPracticed)}</dd></dl></div>`;
  }).join('');
  const opened = performance.now();
  // Time spent reading stats is not thinking time, so push the move clock forward by it.
  const close = () => { if (cur && cur.lastT) cur.lastT += performance.now() - opened; if (back) back(); else hideOverlay(); };   // the overlay blocks input while open, so busy is left alone
  showOverlay(`<h1>Skills &amp; stats</h1><p>Saved in this browser. 80 mastery unlocks the next stage. A mastered skill that drops below 80 is marked "needs review" and shows up more often.</p>${rows}`,
    [['Close', close], ['Reset all progress', () => {
      if (!confirm('Erase all mastery and stats in this browser?')) return;
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      progress = loadProgress(); renderSkills(); showTitle();
    }, true]]);
}
$('statsBtn').addEventListener('click', e => { e.stopPropagation(); if (!$('over').classList.contains('show')) showStats(null); });

// Test hook: lets an automated playtest read the expected move. Not used by the game itself.
window.__game = { get cur() { return cur; }, get hand() { return hand; }, get busy() { return busy; }, get run() { return run; }, get hp() { return hp; },
  get progress() { return progress; }, playCard, correct: () => cur && cur.path[cur.step].move, goNext, newRun };
